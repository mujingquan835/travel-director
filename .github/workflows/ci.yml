name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: local-media-scanner/uv.lock

      - name: Install development dependencies
        working-directory: local-media-scanner
        run: uv sync --locked --extra dev --extra vision

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

      - name: Check pushed diff
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}...HEAD"

      - name: Validate repository Skill package
        working-directory: local-media-scanner
        run: uv run python skills/travel-director/scripts/validate.py skills/travel-director

      - name: Publish Skill to isolated CI home
        working-directory: local-media-scanner
        run: uv run python skills/travel-director/scripts/install.py --codex-home "${{ runner.temp }}/codex-home"

      - name: Report optional official validator status
        working-directory: local-media-scanner
        run: |
          validator="${CODEX_HOME:-$HOME/.codex}/skills/.system/skill-creator/scripts/quick_validate.py"
          if test -f "$validator"; then
            uv run python "$validator" skills/travel-director
          else
            echo "::notice title=Optional Codex validator skipped::Official quick validator is not installed on this runner; repository-contained validation passed in the preceding step."
          fi

      - name: Run test suite
        working-directory: local-media-scanner
        run: uv run pytest -q

      - name: Upload Skill publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: travel-director-release-${{ github.sha }}
          path: ${{ runner.temp }}/codex-home/skill-receipts/travel-director.json
          if-no-files-found: error
          retention-days: 30
