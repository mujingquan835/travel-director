[project]
name = "travel-local-media-scanner"
version = "0.1.0"
description = "Local-first sparse-frame feasibility scanner for travel videos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
vision = [
  "safetensors>=0.5,<1",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "transformers>=4.52,<6",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
travel-scanner = "scanner.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

